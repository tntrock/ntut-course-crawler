name: syllabus

# 教學大綱是**一門課一頁**,所以塞不進每 4 小時一次的例行抓取,獨立成這一支。
#
# 一天兩班,兩班都真的全跑一輪 —— 開學前老師大量在改大綱,半天的落後就有
# 意義。重抓週期因此設 6 小時,而不是「比 12 小時間隔小一點」的 10:Actions
# 的 cron 只保證「不早於」,實測會遲 2~4 小時,前一班遲到、後一班準時的話
# 實際間隔會被壓成 8 小時甚至更短,週期定 6 才保證壓縮後兩班都還是會抓。
#
# 這順帶也保住了備援:前一班若遇上學校斷線整批失敗(2026-09-04 就發生過,
# 學校清晨掛了一小時),當天稍後那班就補得回來,不必等到隔天。
#
# 2026-09-04 用 50 頁實測出 1.20 秒/頁(延遲 1 秒 + 學校回應),據此:
#
#   課程抓取   355 個請求   8.4 分   ← 沒有它就不知道每門課的大綱網址
#   教學大綱  1909 頁      38.3 分   ← 2,717 門課裡只有 1,909 門有大綱連結
#   合計      2264 個請求  約 47 分
#
# 為什麼不分批:分批(每天 800 頁、2.4 天輪完)省不了多少,卻讓資料最多落後
# 一個月 —— 重抓週期得設成 30 天,否則沒抓過的抓完就沒事做了。而實測發現
# 開學前老師正在大量修改大綱(50 份樣本裡最新一筆是抓取前兩小時才改的),
# 落後一個月不能接受。每班全跑直接解掉,也不必為了開學期間手動調參數。
#
# 代價是每天約 94 分鐘的 runner 時間(兩班各約 47 分),以及學期中大綱不動
# 時會拿回一模一樣的內容 —— 但**拿回一樣的內容不會產生任何 git 物件**:
# schema v3 起大綱檔改帶 `content_hash`、不帶抓取時間,雜湊一樣就整個不重寫,
# keep_files 讓遠端那份原封不動留著。單執行緒、1 秒延遲的規則一條都沒有放寬。
#
# 自動偵測會挑出首頁掛著的學期,所以偶爾會連上一個學期(目前是 114-2)一起
# 抓。它是歷史學期,大綱只補沒抓過的,補完就收合、之後永遠跳過 —— 所以最多
# 只有某一班會多花約 48 分鐘,不是每班都多。

on:
  schedule:
    # 台灣 09:00 與 21:00(UTC 01:00 / 13:00)。
    #
    # 別把 cron 的時間當成真的執行時間:Actions 只保證「不早於」,這個 repo
    # 實測常遲 2~4 小時。2026-09-04 的 19:00 UTC 那班遲了 2 小時 20 分,正好
    # 掉進學校清晨斷線的那一小時,整批失敗。所以「挑離峰避開學校維護」是控制
    # 不了的事,真正的保險是下面加長的整批重試,加上一天兩班互為備援。
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      max_syllabus:
        description: '這次最多抓幾頁大綱(0 = 不限,全校一輪約 38 分鐘)'
        default: '0'
      syllabus_refresh_after:
        description: '同一門課的大綱隔多久才重抓(小時)。預設 6 —— 一天兩班都要真的全跑,不能大於兩班被排程延遲壓縮後的間隔'
        default: '6'
      year:
        description: '學年度(留空 = 自動偵測)'
        default: ''
      sem:
        description: '學期 1 或 2(填了 year 才需要)'
        default: ''
      delay:
        description: '每次請求後的延遲秒數(下限 0.5)'
        default: '1.0'

permissions:
  contents: write

# 跟 crawl / backfill 共用同一個群組:同時抓等於對學校併發請求。
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  syllabus:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      # 比 crawl.yml 多撈一個 syllabus.json —— 那是「哪些課的大綱抓過了、
      # 什麼時候抓的」的狀態。少了它每次都會從頭抓,分批就沒有意義。
      - name: Restore shared index files
        run: |
          mkdir -p data
          if git clone --depth 1 --branch gh-pages --filter=blob:none --sparse --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .gh-pages; then
            for f in meta.json index.json errors.json changes.json enrollment.json syllabus.json; do
              if [ -f ".gh-pages/$f" ]; then
                cp ".gh-pages/$f" "data/$f"
                echo "已還原 $f($(stat -c%s "data/$f") bytes)"
              else
                echo "gh-pages 上還沒有 $f"
              fi
            done
          else
            echo "gh-pages 還不存在(第一次跑),從零開始"
          fi

      # 失敗就等 30 分鐘整批重來,最多 5 次(涵蓋約 2.5 小時的學校端斷線)。
      # 比 crawl.yml 的 3 次 × 20 分鐘寬,因為 crawl 一天有 6 個班次可以補,
      # 大綱一天只有兩班 —— 而且 timeout-minutes 是 330,全失敗也只用掉
      # 約 2.7 小時,額度綽綽有餘。
      # 重試很便宜:.cache/ 在同一個 job 內共用,已經抓好的頁面不會再打一次 ——
      # 對一次近兩千頁的大綱批次特別有感,重試只會補剩下的部分。
      - name: Crawl with syllabus
        env:
          YEAR: ${{ inputs.year }}
          SEM: ${{ inputs.sem }}
          DELAY: ${{ inputs.delay || '1.0' }}   # 空字串取右邊,這裡沒有 0 的疑慮
          # 預設值在下面用 ${VAR:-default} 補,不用 `${{ inputs.x || '0' }}` ——
          # 後者在使用者明確填 0 時會被當成假值而取右邊,那是個安靜的坑。
          MAX_SYLLABUS: ${{ inputs.max_syllabus }}
          SYLLABUS_REFRESH_AFTER: ${{ inputs.syllabus_refresh_after }}
          MAX_ATTEMPTS: '5'
          RETRY_WAIT_SECONDS: '1800'
        run: |
          # 0 = 不限頁數。搭配夠短的重抓週期才是真的「每班全跑」——
          # 只放寬頁數而週期留在 30 天的話,抓完一輪之後每班都會抓 0 頁。
          MAX_SYLLABUS="${MAX_SYLLABUS:-0}"
          SYLLABUS_REFRESH_AFTER="${SYLLABUS_REFRESH_AFTER:-6}"

          args=(--out data/ --delay "$DELAY" --with-syllabus
                --max-syllabus "$MAX_SYLLABUS"
                --syllabus-refresh-after "$SYLLABUS_REFRESH_AFTER")
          if [ -n "$YEAR" ]; then
            args+=(--year "$YEAR" --sem "$SEM")
          fi

          attempt=1
          until python -m crawler.main "${args[@]}"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::連續 $attempt 次失敗,放棄本次執行(下一班排程會接續)"
              exit 1
            fi
            echo "::warning::第 $attempt 次失敗,等 $((RETRY_WAIT_SECONDS / 60)) 分鐘後整批重來"
            sleep "$RETRY_WAIT_SECONDS"
            attempt=$((attempt + 1))
          done

      - name: Show progress
        if: always()
        run: |
          if [ -f data/syllabus.json ]; then
            python - <<'PY'
          import json
          data = json.load(open("data/syllabus.json", encoding="utf-8"))
          for s in data.get("semesters", []):
              total = s.get("with_url") or 0
              done = s.get("fetched") or 0
              pct = f"{done / total * 100:.1f}%" if total else "?"
              if s.get("frozen"):
                  print(f"{s['semester']}:已補完 {done}/{total}({pct}),"
                        f"狀態已收合於 {s.get('frozen_at')}")
              else:
                  print(f"{s['semester']}:已抓 {done}/{total}({pct}),"
                        f"最舊一筆 {s.get('oldest_fetch')}")
          PY
          else
            echo "尚無教學大綱資料"
          fi

      - name: Add landing page
        run: cp web/index.html data/index.html

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 7

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          keep_files: true
