name: syllabus

# 教學大綱是**一門課一頁**,所以塞不進每 4 小時一次的例行抓取,獨立成這一支。
#
# 每天全跑一輪。2026-09-04 用 50 頁實測出 1.20 秒/頁(延遲 1 秒 + 學校回應),
# 據此:
#
#   課程抓取   355 個請求   8.4 分   ← 沒有它就不知道每門課的大綱網址
#   教學大綱  1909 頁      38.3 分   ← 2,717 門課裡只有 1,909 門有大綱連結
#   合計      2264 個請求  約 47 分
#
# 為什麼不分批:分批(每天 800 頁、2.4 天輪完)省不了多少,卻讓資料最多落後
# 一個月 —— 重抓週期得設成 30 天,否則沒抓過的抓完就沒事做了。而實測發現
# 開學前老師正在大量修改大綱(50 份樣本裡最新一筆是抓取前兩小時才改的),
# 落後一個月不能接受。每天全跑直接解掉,也不必為了開學期間手動調參數。
#
# 代價是每天多約 38 分鐘的 runner 時間,以及學期中大綱不動時會拿回一模一樣
# 的內容。單執行緒、1 秒延遲的規則一條都沒有放寬。

on:
  schedule:
    # 每天 UTC 19:00 = 台灣清晨 03:00。挑離峰,也避開 4 小時排程的整點。
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      max_syllabus:
        description: '這次最多抓幾頁大綱(0 = 不限,全校一輪約 38 分鐘)'
        default: '0'
      syllabus_refresh_after:
        description: '同一門課的大綱隔多久才重抓(小時)。要每天全跑就得小於 24'
        default: '20'
      year:
        description: '學年度(留空 = 自動偵測)'
        default: ''
      sem:
        description: '學期 1 或 2(填了 year 才需要)'
        default: ''
      delay:
        description: '每次請求後的延遲秒數(下限 0.5)'
        default: '1.0'

permissions:
  contents: write

# 跟 crawl / backfill 共用同一個群組:同時抓等於對學校併發請求。
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  syllabus:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      # 比 crawl.yml 多撈一個 syllabus.json —— 那是「哪些課的大綱抓過了、
      # 什麼時候抓的」的狀態。少了它每次都會從頭抓,分批就沒有意義。
      - name: Restore shared index files
        run: |
          mkdir -p data
          if git clone --depth 1 --branch gh-pages --filter=blob:none --sparse --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .gh-pages; then
            for f in meta.json index.json errors.json changes.json enrollment.json syllabus.json; do
              if [ -f ".gh-pages/$f" ]; then
                cp ".gh-pages/$f" "data/$f"
                echo "已還原 $f($(stat -c%s "data/$f") bytes)"
              else
                echo "gh-pages 上還沒有 $f"
              fi
            done
          else
            echo "gh-pages 還不存在(第一次跑),從零開始"
          fi

      # 失敗就等 20 分鐘整批重來,理由同 crawl.yml。
      # 重試很便宜:.cache/ 在同一個 job 內共用,已經抓好的頁面不會再打一次 ——
      # 對一次近兩千頁的大綱批次特別有感,重試只會補剩下的部分。
      - name: Crawl with syllabus
        env:
          YEAR: ${{ inputs.year }}
          SEM: ${{ inputs.sem }}
          DELAY: ${{ inputs.delay || '1.0' }}   # 空字串取右邊,這裡沒有 0 的疑慮
          # 預設值在下面用 ${VAR:-default} 補,不用 `${{ inputs.x || '0' }}` ——
          # 後者在使用者明確填 0 時會被當成假值而取右邊,那是個安靜的坑。
          MAX_SYLLABUS: ${{ inputs.max_syllabus }}
          SYLLABUS_REFRESH_AFTER: ${{ inputs.syllabus_refresh_after }}
          MAX_ATTEMPTS: '3'
          RETRY_WAIT_SECONDS: '1200'
        run: |
          # 0 = 不限頁數。搭配小於 24 小時的重抓週期才是真的「每天全跑」——
          # 只放寬頁數而週期留在 30 天的話,抓完一輪之後每天都會抓 0 頁。
          MAX_SYLLABUS="${MAX_SYLLABUS:-0}"
          SYLLABUS_REFRESH_AFTER="${SYLLABUS_REFRESH_AFTER:-20}"

          args=(--out data/ --delay "$DELAY" --with-syllabus
                --max-syllabus "$MAX_SYLLABUS"
                --syllabus-refresh-after "$SYLLABUS_REFRESH_AFTER")
          if [ -n "$YEAR" ]; then
            args+=(--year "$YEAR" --sem "$SEM")
          fi

          attempt=1
          until python -m crawler.main "${args[@]}"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::連續 $attempt 次失敗,放棄本次執行(明天的排程會接續)"
              exit 1
            fi
            echo "::warning::第 $attempt 次失敗,等 $((RETRY_WAIT_SECONDS / 60)) 分鐘後整批重來"
            sleep "$RETRY_WAIT_SECONDS"
            attempt=$((attempt + 1))
          done

      - name: Show progress
        if: always()
        run: |
          if [ -f data/syllabus.json ]; then
            python - <<'PY'
          import json
          data = json.load(open("data/syllabus.json", encoding="utf-8"))
          for s in data.get("semesters", []):
              total = s.get("with_url") or 0
              done = s.get("fetched") or 0
              pct = f"{done / total * 100:.1f}%" if total else "?"
              print(f"{s['semester']}:已抓 {done}/{total}({pct}),"
                    f"最舊一筆 {s.get('oldest_fetch')}")
          PY
          else
            echo "尚無教學大綱資料"
          fi

      - name: Add landing page
        run: cp web/index.html data/index.html

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 7

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          keep_files: true
