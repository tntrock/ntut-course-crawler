name: crawl

on:
  schedule:
    # 每 4 小時一次(UTC 00/04/08/12/16/20 時 → 台灣 08/12/16/20/00/04 時)。
    # Actions 的 cron 只保證「不早於」,實測這個 repo 常遲 2~4 小時。
    # 對例行抓取無所謂(一天六班,漏了下一班就補),但別拿它來避開特定時段。
    - cron: '0 */4 * * *'
    # 每月 1 號 UTC 06:00(台灣 14:00)那班改跑整包重建,見 job 層的 REBUILD。
    # 為什麼要:平常發布走 keep_files,gh-pages 的 commit 歷史只增不減 ——
    # 2026-09-05 實測每次發布讓 pack 多約 1.2 MB,一天八班(六次 crawl +
    # 兩次 syllabus)就是一年 2 GB 起跳,幾個月就會頂到 GitHub 建議的 1 GB。
    # 每月壓一次歷史,順便清掉班級 / 教師消失後留在遠端的幽靈檔。
    # 這一天沒有 4 小時排程的班次(04:00 與 08:00 之間),不會自己撞自己。
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: '學年度(留空 = 自動偵測學校首頁目前開放的學期)'
        default: ''
      sem:
        description: '學期 1 或 2(填了 year 才需要)'
        default: ''
      dept:
        description: '只抓單一系所代碼(冒煙測試用;填了就不會發布)'
        default: ''
      delay:
        description: '每次請求後的延遲秒數(下限 0.5)'
        default: '1.0'
      refresh_after:
        description: '非最新學期隔多久才重抓一次(小時)'
        default: '24'
      all_semesters:
        description: '強制重抓首頁列出的每個學年期'
        type: boolean
        default: false
      rebuild:
        description: '整包重建:撈回全部歷史資料後用 force_orphan 重發布(清幽靈檔並壓掉 gh-pages 歷史)。每月 1 號本來就會自動跑一次,這裡是要提前跑才勾'
        type: boolean
        default: false

permissions:
  contents: write

# 同時只跑一個 crawl。兩個 job 一起抓等於對學校併發請求,
# 那正是 plan.md §1.4 要避免的事。回補共用同一個群組(見 backfill.yml)。
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      # 手動勾選 rebuild,或每月 1 號那班排程。schedule 事件沒有 inputs,
      # 只能靠 github.event.schedule 認出是哪一條 cron 觸發的;手動觸發時
      # github.event.schedule 是空的,所以兩邊不會互相誤判。
      # 值是字串 'true' / 'false',下面一律用字串比較。
      REBUILD: ${{ inputs.rebuild || github.event.schedule == '0 6 1 * *' }}
    # Actions 單 job 上限 6 小時,留緩衝。最壞情況是三次抓取全失敗:
    # 3 × 約 15 分鐘 + 2 × 20 分鐘等待 ≈ 85 分鐘,離上限還很遠。
    # 整包重建那班另外要 clone 整個 gh-pages(2026-09-05 實測 322 MB /
    # 66,148 個檔)再 force push 回去,粗估多 20~40 分鐘,同樣還很寬裕。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 解析器的測試是對真實 fixture 斷言的。學校改版時這裡會先紅,
      # 我們就不會把解錯的資料發布出去。
      - name: Test
        run: pytest -q

      # 只撈幾個跨學期的檔案,不是整包 —— 理由見 restore-note.md。
      # --sparse 只 checkout 根目錄下的檔案,正好就是這幾個;歷史學期的
      # 幾千個檔連 blob 都不會下載。發布用 keep_files,它們也不必在本機出現。
      - name: Restore shared index files
        if: ${{ env.REBUILD != 'true' }}
        run: |
          mkdir -p data
          if git clone --depth 1 --branch gh-pages --filter=blob:none --sparse --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .gh-pages; then
            for f in meta.json index.json errors.json changes.json enrollment.json runs.json; do
              if [ -f ".gh-pages/$f" ]; then
                cp ".gh-pages/$f" "data/$f"
                echo "已還原 $f($(stat -c%s "data/$f") bytes)"
              else
                echo "gh-pages 上還沒有 $f"
              fi
            done
          else
            echo "gh-pages 還不存在(第一次跑),從零開始"
          fi

      # rebuild 模式要整包比對,才有辦法把消失的班級 / 教師留下的幽靈檔清掉。
      #
      # clone 失敗**必須讓整個 job 死掉**。這一步後面接的是 force_orphan,
      # 它會把 gh-pages 整個覆蓋掉 —— 沒撈回來就繼續跑的話,data/ 裡只剩
      # 當期那一個學期,發布出去等於把 51 個學期的資料連同能救回來的
      # commit 歷史一起銷毀。所以這裡不做 if/else 的「優雅降級」:
      # 失敗就停,下個月的排程(或手動)再來一次就好。
      - name: Restore everything (rebuild)
        if: ${{ env.REBUILD == 'true' }}
        run: |
          git clone --depth 1 --branch gh-pages --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .gh-pages
          mkdir -p data
          cp -r .gh-pages/. data/
          rm -rf data/.git
          files=$(find data -type f | wc -l)
          sems=$(python -c "import json,pathlib;p=pathlib.Path('data/meta.json');print(len(json.loads(p.read_text(encoding='utf-8')).get('semesters') or []) if p.exists() else 0)")
          echo "已載回整包:$files 個檔案、$sems 個學期"
          # 留給下面的檢查步驟當基準
          echo "REBUILD_BASE_FILES=$files" >> "$GITHUB_ENV"
          echo "REBUILD_BASE_SEMESTERS=$sems" >> "$GITHUB_ENV"

      # 參數一律走環境變數,不直接把 inputs 內插進 shell —— 那是 script injection。
      #
      # 失敗就等一段時間整批重來。crawler 內部的重試是「單一請求」層次的
      # (8 次、約 7.5 分鐘),那治得了線路抖動,治不了實際遇過的中斷 ——
      # 2026-09-04 08:33 UTC 那次 GitHub runner 連不到學校,持續了近一小時,
      # 而同一時間從台灣連只要 17 毫秒。這種幾十分鐘等級的中斷只能等。
      #
      # 三次嘗試、每次間隔 20 分鐘,涵蓋約 55 分鐘的時窗。再撐下去意義不大:
      # 中斷若超過一小時,四小時後的下一班排程才是對的復原手段,而不是讓
      # runner 空轉。中斷期間封包在防火牆就被丟了,對學校沒有額外負擔。
      #
      # 重試很便宜:.cache/ 在同一個 job 內是共用的,前一次已經抓到的頁面
      # 不會再打一次,所以「抓到一半失敗」的重試只會補剩下的部分。
      - name: Crawl
        env:
          YEAR: ${{ inputs.year }}
          SEM: ${{ inputs.sem }}
          DEPT: ${{ inputs.dept }}
          DELAY: ${{ inputs.delay || '1.0' }}
          REFRESH_AFTER: ${{ inputs.refresh_after || '24' }}
          ALL_SEMESTERS: ${{ inputs.all_semesters }}
          MAX_ATTEMPTS: '3'
          RETRY_WAIT_SECONDS: '1200'
        run: |
          args=(--out data/ --delay "$DELAY" --refresh-after "$REFRESH_AFTER"
                --run-summary "$RUNNER_TEMP/run-summary.json")
          if [ -n "$YEAR" ]; then
            args+=(--year "$YEAR" --sem "$SEM")
          fi
          if [ -n "$DEPT" ]; then
            args+=(--dept "$DEPT")
          fi
          if [ "$ALL_SEMESTERS" = "true" ]; then
            args+=(--all-semesters)
          fi

          attempt=1
          until python -m crawler.main "${args[@]}"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::抓取連續 $attempt 次失敗,放棄本次執行(下一班排程會再試)"
              echo "CRAWL_ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              exit 1
            fi
            echo "::warning::第 $attempt 次抓取失敗,等 $((RETRY_WAIT_SECONDS / 60)) 分鐘後整批重來"
            sleep "$RETRY_WAIT_SECONDS"
            attempt=$((attempt + 1))
          done

          # 給 Record this run 用:「一次就過」和「重試三次才過」對狀態頁
          # 是兩回事。放棄的那條路徑在上面也寫了一次。
          echo "CRAWL_ATTEMPTS=$attempt" >> "$GITHUB_ENV"


      # 不論成功、失敗、還是 job 逾時被砍,都留下一筆執行紀錄。
      #
      # Actions 自己的 log 是給人看的:要登入點進去或帶 token 打 API,而且
      # 只留 90 天。狀態頁需要的是一份跟資料放在一起、直接 fetch 就拿得到的
      # 紀錄 —— 那就是 runs.json。
      #
      # 狀態從 job.status 拿而不是由爬蟲自己寫,因為最需要紀錄的那幾次
      # (逾時被砍、整批重試用完)爬蟲根本沒機會寫任何東西。
      - name: Record this run
        if: always()
        run: |
          python -m crawler.runlog --out data/ \
            --status "${{ job.status }}" \
            --summary "$RUNNER_TEMP/run-summary.json"

      # 首頁。gh-pages 根目錄沒有 index.html 的話,GitHub Pages 會退而直接把
      # 1.5 MB 的 index.json 吐給訪客 —— 那不是給人看的東西。
      # 用 keep_files 發布,所以這個檔在兩支 workflow 之間會一直留著,
      # 但兩邊都複製一份比較保險(rebuild 會把根目錄清掉重來)。
      - name: Add landing page
        if: always()
        run: cp web/index.html data/index.html

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 7

      # force_orphan 是不可逆的:推上去之後 gh-pages 的舊 commit 就沒了,
      # 撈不回來。所以發布前再確認一次 data/ 真的是整包,而不是中途某一步
      # 出錯之後只剩當期學期的殘骸。寧可這個月不重建,也不要發布出去。
      - name: Verify the rebuild is a full tree
        if: ${{ !inputs.dept && env.REBUILD == 'true' }}
        run: |
          files=$(find data -type f | wc -l)
          sems=$(python -c "import json,pathlib;p=pathlib.Path('data/meta.json');print(len(json.loads(p.read_text(encoding='utf-8')).get('semesters') or []) if p.exists() else 0)")
          echo "重建後 $files 個檔案 / $sems 個學期(重建前 $REBUILD_BASE_FILES / $REBUILD_BASE_SEMESTERS)"
          if [ "$sems" -lt "$REBUILD_BASE_SEMESTERS" ]; then
            echo "::error::學期數從 $REBUILD_BASE_SEMESTERS 掉到 $sems,不發布"
            exit 1
          fi
          # 當期的 courses / teachers / classes 會整批重寫,檔案數本來就會
          # 小幅浮動,所以抓九成當門檻,不要求只增不減。
          if [ "$files" -lt "$((REBUILD_BASE_FILES * 9 / 10))" ]; then
            echo "::error::檔案數從 $REBUILD_BASE_FILES 掉到 $files(不到九成),不發布"
            exit 1
          fi

      # 平常只推當期的資料,歷史學期靠 keep_files 留在分支上不動。
      # 代價是班級 / 教師消失時遠端會留下幽靈檔 —— 那由 rebuild 模式清。
      # always():抓到一半失敗、或 job 逾時被砍,也要把已經完成的部分推上去。
      # 這一步是 keep_files,只會補上 data/ 裡有的檔案,沒寫出來的維持遠端原樣,
      # 所以「半批成果」不會傷到任何東西 —— 而不推的話,跑了幾小時的成果
      # 就只剩 artifact 裡那一份,要靠人工撈回來。
      # 寫檔本身是先寫暫存檔再 rename(見 output.py 的 _write_json),
      # 被砍在寫到一半也不會留下截斷的 JSON。
      - name: Publish to gh-pages
        if: ${{ always() && !inputs.dept && env.REBUILD != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          keep_files: true

      # 整包重發:順便把 gh-pages 的 commit 歷史壓成一個,避免 repo 無限膨脹
      - name: Publish to gh-pages (rebuild)
        if: ${{ !inputs.dept && env.REBUILD == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          force_orphan: true
