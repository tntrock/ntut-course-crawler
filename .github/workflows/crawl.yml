name: crawl

on:
  schedule:
    # 每 4 小時一次(UTC 00/04/08/12/16/20 時 → 台灣 08/12/16/20/00/04 時)。
    # Actions 的 cron 在尖峰常延遲十幾分鐘,對本專案無影響。
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: '學年度(留空 = 自動偵測學校首頁目前開放的學期)'
        default: ''
      sem:
        description: '學期 1 或 2(填了 year 才需要)'
        default: ''
      dept:
        description: '只抓單一系所代碼(冒煙測試用;填了就不會發布到 gh-pages)'
        default: ''
      delay:
        description: '每次請求後的延遲秒數(下限 0.5)'
        default: '1.0'
      refresh_after:
        description: '非最新學期隔多久才重抓一次(小時)'
        default: '24'
      all_semesters:
        description: '強制重抓首頁列出的每個學年期'
        type: boolean
        default: false

permissions:
  contents: write

# 同時只跑一個 crawl。兩個 job 一起抓等於對學校併發請求,
# 那正是 plan.md §1.4 要避免的事。
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # Actions 單 job 上限 6 小時,留緩衝
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 解析器的測試是對真實 fixture 斷言的。學校改版時這裡會先紅,
      # 我們就不會把解錯的資料發布出去。
      - name: Test
        run: pytest -q

      # 發布用的是 force_orphan(不留歷史),所以 data/ 每次都是空的。
      # 不先把上次的成果撈回來的話:
      #   1. meta.json / index.json 沒有舊學期可合併,歷史學期會整個消失
      #   2. 判斷不出「這學期上次是什麼時候抓的」,--refresh-after 形同虛設
      - name: Restore previously published data
        run: |
          if git clone --depth 1 --branch gh-pages --quiet \
              "https://github.com/${GITHUB_REPOSITORY}.git" .gh-pages; then
            mkdir -p data
            cp -r .gh-pages/. data/
            rm -rf data/.git
            echo "已載回前一次發布的資料:$(ls data | tr '\n' ' ')"
          else
            echo "gh-pages 還不存在(第一次跑),從零開始"
          fi

      # 參數一律走環境變數,不直接把 inputs 內插進 shell —— 那是 script injection。
      - name: Crawl
        env:
          YEAR: ${{ inputs.year }}
          SEM: ${{ inputs.sem }}
          DEPT: ${{ inputs.dept }}
          DELAY: ${{ inputs.delay || '1.0' }}
          REFRESH_AFTER: ${{ inputs.refresh_after || '24' }}
          ALL_SEMESTERS: ${{ inputs.all_semesters }}
        run: |
          args=(--out data/ --delay "$DELAY" --refresh-after "$REFRESH_AFTER")
          if [ -n "$YEAR" ]; then
            args+=(--year "$YEAR" --sem "$SEM")
          fi
          if [ -n "$DEPT" ]; then
            args+=(--dept "$DEPT")
          fi
          if [ "$ALL_SEMESTERS" = "true" ]; then
            args+=(--all-semesters)
          fi
          python -m crawler.main "${args[@]}"

      # 不論成功失敗都留一份,方便事後檢查
      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 7

      # 只抓單一系所時資料是不完整的,不可以蓋掉線上的完整資料集
      - name: Publish to gh-pages
        if: ${{ !inputs.dept }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          force_orphan: true    # 不保留歷史,避免 repo 無限膨脹
