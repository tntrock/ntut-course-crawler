name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 整個測試套件完全離線(tests/conftest.py 的 no_real_network 會擋下
      # 任何真實請求),所以 CI 跑再多次也不會打到學校伺服器。
      - run: pytest -q
