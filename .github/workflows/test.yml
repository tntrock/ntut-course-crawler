name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # id-token:用 OIDC 上傳 Codecov,不必在 repo 存 CODECOV_TOKEN。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 整個測試套件完全離線(tests/conftest.py 的 no_real_network 會擋下
      # 任何真實請求),所以 CI 跑再多次也不會打到學校伺服器。
      - run: pytest -q --cov=crawler --cov-report=xml

      # fork 來的 PR 拿不到 OIDC token,上傳失敗不該讓測試變紅。
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: coverage.xml
          fail_ci_if_error: false
